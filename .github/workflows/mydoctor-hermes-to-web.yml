name: MyDoctor original Hermes to React web extraction proof
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mydoctor-hermes-to-react-web-20261114
    paths:
      - .github/workflows/mydoctor-hermes-to-web.yml
      - mydoctor-clone/hermes-web/**
      - mydoctor-clone/frontend/package.json
      - mydoctor-clone/frontend/vite.config.js
      - mydoctor-clone/frontend/tests/hermes-web-verification.cjs
      - mydoctor-clone/frontend/src/RecoveredHermesWebScreen.jsx
      - mydoctor-clone/frontend/src/HermesGptPreview.jsx
      - mydoctor-clone/frontend/src/App.jsx
concurrency:
  group: hermes-web-port-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  extract-original-hbc:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Hermes decompiler
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/mydoctor-tool
          curl -fLsS --retry 3 https://github.com/SymbioticSec/hermes-decomp/releases/download/v0.2.4/hermes-decomp-v0.2.4-linux-x86_64.tar.gz -o /tmp/mydoctor-tool/compiler.tar.gz
          curl -fLsS --retry 3 https://github.com/SymbioticSec/hermes-decomp/releases/download/v0.2.4/SHA256SUMS -o /tmp/mydoctor-tool/SHA256SUMS
          (cd /tmp/mydoctor-tool && grep 'hermes-decomp-v0.2.4-linux-x86_64.tar.gz' SHA256SUMS | sed 's/hermes-decomp-v0.2.4-linux-x86_64.tar.gz/compiler.tar.gz/' | sha256sum -c -)
          tar -xzf /tmp/mydoctor-tool/compiler.tar.gz -C /tmp/mydoctor-tool
          TOOL="$(find /tmp/mydoctor-tool -type f -name hermes-decomp | head -n1)"
          test -n "$TOOL"
          chmod +x "$TOOL"
          echo "HERMES_DECOMP=$TOOL" >> "$GITHUB_ENV"
          "$TOOL" --help >/dev/null
      - name: Obtain original app and validate user-supplied HBC hash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/mydoctor-private
          curl -fL --retry 3 --connect-timeout 20 --max-time 280 \
            --user-agent 'Mozilla/5.0 Chrome/124.0.0.0 Safari/537.36' \
            'https://d.apkpure.net/b/XAPK/com.merakiplace.mydoctor?nc=arm64-v8a&sv=24&versionCode=1206' \
            -o /tmp/mydoctor-private/original.xapk
          unzip -tqq /tmp/mydoctor-private/original.xapk
      - name: Recover original UI function structures without publishing code
        run: |
          set -Eeuo pipefail
          python3 -m py_compile mydoctor-clone/hermes-web/extract_original_ui.py
          python3 mydoctor-clone/hermes-web/extract_original_ui.py \
            --xapk /tmp/mydoctor-private/original.xapk \
            --out mydoctor-clone/hermes-web/audit \
            --decompiler "$HERMES_DECOMP"
      - name: Validate GPT UI conversion code and source-bound output checks
        run: |
          set -Eeuo pipefail
          python3 -m py_compile mydoctor-clone/hermes-web/gpt_ui_port.py
          python3 -m unittest discover -s mydoctor-clone/hermes-web/tests -p 'test_*.py' -v
          python3 mydoctor-clone/hermes-web/gpt_ui_port.py \
            --xapk /tmp/mydoctor-private/original.xapk \
            --out mydoctor-clone/hermes-web/audit/gpt-plan \
            --screen all
      - name: Test full Hermes bundle JavaScript recovery without exporting source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -Eeuo pipefail
          python3 mydoctor-clone/hermes-web/audit_full_bundle.py \
            --xapk /tmp/mydoctor-private/original.xapk \
            --out mydoctor-clone/hermes-web/audit \
            --decompiler "$HERMES_DECOMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether GPT API credential is available
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "GPT_API_CREDENTIAL_CONFIGURED=true"
          else
            echo "GPT_API_CREDENTIAL_CONFIGURED=false"
          fi
      - name: GPT automatic conversion of original Hermes screens (when API key configured)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          set -Eeuo pipefail
          python3 mydoctor-clone/hermes-web/gpt_ui_port.py \
            --xapk /tmp/mydoctor-private/original.xapk \
            --out mydoctor-clone/hermes-web/audit/gpt-generated \
            --decompiler "$HERMES_DECOMP" \
            --screen all \
            --generate
      - name: Copy original GPT trees into Vite preview when generated
        run: |
          set -Eeuo pipefail
          if [ -f mydoctor-clone/hermes-web/audit/gpt-generated/home.json ]; then
            mkdir -p mydoctor-clone/frontend/public/hermes-generated
            cp mydoctor-clone/hermes-web/audit/gpt-generated/*.json mydoctor-clone/frontend/public/hermes-generated/
            echo "SOURCE_VERIFIED_GPT_SCREENS_INSTALLED=1"
          else
            echo "NO_GPT_KEY_OR_CONVERTED_UI_AVAILABLE=1"
          fi
      - name: Verify native component renderer works within React web
        run: |
          set -Eeuo pipefail
          cd mydoctor-clone/frontend
          npm install --no-audit --no-fund
          npm run test:hermes-web
          ./node_modules/.bin/esbuild src/RecoveredHermesWebScreen.jsx --bundle --platform=browser --format=esm --external:react --external:react-native-web --outfile=/tmp/verified-hermes-react-web-host.js
          npm run build
      - name: Publish GPT-converted tree JSON (review required)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-hermes-gpt-web-tree-preview
          path: |
            mydoctor-clone/hermes-web/audit/gpt-generated/*.json
            mydoctor-clone/hermes-web/audit/gpt-plan/plan.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish experimental React web preview build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-hermes-gpt-preview-dist
          path: mydoctor-clone/frontend/dist/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish structural audit only, not proprietary bytecode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-hermes-web-structural-audit
          path: mydoctor-clone/hermes-web/audit/*.json
          if-no-files-found: warn
          retention-days: 7
