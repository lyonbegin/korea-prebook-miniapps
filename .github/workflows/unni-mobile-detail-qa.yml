name: UNNI mobile detail end-to-end QA
on:
  push:
    branches:
      - feature/unni-global-full-clone-20261104
    paths:
      - unni-global-clone/frontend/**
      - unni-global-clone/backend/**
      - .github/workflows/unni-mobile-detail-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-inquiries-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unniqa
          POSTGRES_PASSWORD: ephemeral-test-password
          POSTGRES_DB: unniqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unniqa -d unniqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        working-directory: unni-global-clone/backend
        run: python -m pip install -r requirements.txt
      - name: Verify independent inquiry lifecycle against isolated PostgreSQL
        working-directory: unni-global-clone/backend
        env:
          TEST_DATABASE_URL: postgresql://unniqa:ephemeral-test-password@127.0.0.1:5432/unniqa
          UNNI_STAFF_TOKEN: ''
        run: python -m unittest discover -s tests -p test_inquiries_postgres.py -v

  verify-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend and matching Playwright JS package
        working-directory: unni-global-clone/frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
          # Chromium and Linux dependencies are preinstalled in the pinned official image.
      - name: Compile actual checked-out frontend
        working-directory: unni-global-clone/frontend
        run: npm run build
      - name: Start checked-out frontend with read-only source gateway
        working-directory: unni-global-clone/frontend
        env:
          UNNI_TEST_PROXY_TARGET: https://unni-mobile-api-production.up.railway.app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/unni-vite-ci.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/unni-vite-ci.log
          exit 1
      - name: Smoke test actual checked-out frontend, not stale Railway build
        working-directory: unni-global-clone/frontend
        env:
          UNNI_URL: http://127.0.0.1:5173
        run: node tests/live-smoke.cjs
      - name: Capture original-vs-clone viewport differences (diagnostic, not parity pass)
        if: always()
        working-directory: unni-global-clone/frontend
        env:
          UNNI_URL: http://127.0.0.1:5173
        run: node tests/source-parity.cjs
      - name: Keep screenshots, outputs and errors even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unni-live-mobile-qa
          path: unni-global-clone/frontend/qa-artifacts/
          if-no-files-found: ignore
