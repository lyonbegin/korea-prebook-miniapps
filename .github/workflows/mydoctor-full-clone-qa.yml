name: MyDoctor source/clone parity and mobile E2E
on:
  push:
    branches:
      - feature/mydoctor-full-clone-20261109
    paths:
      - mydoctor-clone/**
      - .github/workflows/mydoctor-full-clone-qa.yml
  workflow_dispatch:
concurrency:
  group: mydoctor-source-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  test-parser-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydoctorqa
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: ephemeral-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d mydoctorqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: mydoctor-clone/backend
        run: pip install -r requirements.txt
      - name: Verify public parser (not invented original data)
        working-directory: mydoctor-clone/backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Initialize independent schema in isolated CI PostgreSQL
        working-directory: mydoctor-clone/backend
        env:
          TEST_DATABASE_URL: postgresql://qa:ephemeral-test-password@127.0.0.1:5432/mydoctorqa
        run: |
          python - <<'PY'
          import os,asyncio,asyncpg
          from app.catalog_schema import SCHEMA
          from app.native_catalog import NATIVE_CACHE_SCHEMA
          async def check():
              conn=await asyncpg.connect(os.environ['TEST_DATABASE_URL'])
              await conn.execute(SCHEMA)
              await conn.execute(NATIVE_CACHE_SCHEMA)
              assert await conn.fetchval("SELECT to_regclass('mydoctor_clone.native_public_api_cache') IS NOT NULL")
              assert await conn.fetchval("SELECT to_regclass('mydoctor_clone.hospitals') IS NOT NULL")
              assert await conn.fetchval("SELECT to_regclass('mydoctor_clone.source_records') IS NOT NULL")
              assert await conn.fetchval("SELECT to_regclass('public.foo') IS NULL")
              assert await conn.fetchval("SELECT to_regclass('mydoctor_clone.public_page_facts') IS NOT NULL")
              await conn.close()
              from app.public_facts import seed_observed_facts
              pool=await asyncpg.create_pool(os.environ["TEST_DATABASE_URL"],min_size=1,max_size=2)
              count=await seed_observed_facts(pool)
              assert count==29, f"Expected 29 source-observed entries, got {count}"
              async with pool.acquire() as db:
                  stored=await db.fetchval("SELECT COUNT(*) FROM mydoctor_clone.public_page_facts")
                  clinic=await db.fetchval("SELECT facts->'tables'->0->'rows'->0->>1 FROM mydoctor_clone.public_page_facts WHERE route_path='/hospital/detail?hospital_id=323'")
              assert stored==29, stored
              assert clinic=="5,600원", clinic
              print(f"DB-first facts persisted: {stored}; clinic price {clinic}")
              await pool.close()

              await conn.close()
          asyncio.run(check())
          PY
  test-mobile-against-real-source:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact Playwright browser-compatible package
        working-directory: mydoctor-clone/frontend
        run: npm install --no-audit --no-fund
      - name: Build checked-out source
        working-directory: mydoctor-clone/frontend
        run: npm run build
      - name: Audit 103 menu destinations for real HTTP200-sourced data (never count a URL as data)
        working-directory: mydoctor-clone/frontend
        run: node tests/menu-source-coverage.cjs
      - name: Load original 29 mobile and 5 full-page screenshots captured on source HTTP200
        uses: actions/download-artifact@v4
        with:
          name: mydoctor-source-parity
          run-id: 42650015118
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: mydoctor-clone/frontend/qa-baseline
      - name: Capture factual fields from real public original pages
        working-directory: mydoctor-clone/frontend
        run: node tests/capture-source-facts.cjs
      - name: Capture real public menu destinations from original HTTP200 across all 6 categories
        if: github.event_name == 'workflow_dispatch'
        working-directory: mydoctor-clone/frontend
        env:
          MD_MENU_CAPTURE_LIMIT: 36
        run: node tests/capture-menu-source-facts.cjs
      - name: Preserve captured public factual metadata as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-observed-public-facts
          path: |
            mydoctor-clone/backend/data/public_source_facts_20261109.json
            mydoctor-clone/backend/data/public_menu_facts_20261110.json
      - name: Commit enriched public facts for existing PostgreSQL startup import
        if: github.event_name == 'workflow_dispatch'
        working-directory: mydoctor-clone/frontend
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C ../.. status --short
          git -C ../.. config user.name "github-actions[bot]"
          git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../.. add mydoctor-clone/backend/data/public_source_facts_20261109.json
          if [ -f ../backend/data/public_menu_facts_20261110.json ]; then git -C ../.. add mydoctor-clone/backend/data/public_menu_facts_20261110.json; fi
          if ! git -C ../.. diff --cached --quiet; then
            git -C ../.. commit -m "data(mydoctor): enrich publicly verified page facts [skip ci]"
            git -C ../.. push origin HEAD:feature/mydoctor-full-clone-20261109 || echo "MENU SEED PUSH CONFLICT: data preserved as artifact; continue actual browser-click QA"
          else
            echo "No new observed factual fields; no DB seed changes."
          fi
      - name: Start local checked-out frontend and verified public API
        working-directory: mydoctor-clone/frontend
        env:
          MD_TEST_PROXY_TARGET: https://mydoctor-mobile-api-production.up.railway.app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/mydoctor-vite.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mydoctor-vite.log
          exit 1
      - name: Confirm actual public upstream API and PostgreSQL availability
        run: |
          curl --fail --show-error --silent https://mydoctor-mobile-api-production.up.railway.app/health
          curl --fail --show-error --silent https://mydoctor-mobile-api-production.up.railway.app/catalog/status
      - name: Audit original 6 main menus, 11 groups and 103 linked destinations
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/menu-inventory.cjs
      - name: Verify native 6.50.0-derived 390x844 layout and REAL mobile navigation
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/native-app-layout.cjs
      - name: Physically tap EVERY link on the supplied skin clinic directory and inspect real destination
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/skin-directory-all-clicks.cjs
      - name: Tap all 103 menu entries on 390px mobile and confirm explicit response even on original 429
        if: always()
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/menu-103-taps.cjs
      - name: Test actual menu taps, page content and result-row click-through (not just URLs)
        if: always()
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/menu-click-e2e.cjs
      - name: Ensure real result rows never point to their current page (inert self-link regression)
        if: always()
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/self-link-guard.cjs
      - name: Verify original healthLab deep-link SPA routes do not get swallowed by API health proxy
        working-directory: mydoctor-clone/frontend
        run: |
          for route in /healthLab /healthLab/FAQ /healthLab/calculator/bmi; do
            status=$(curl --silent -o /tmp/mydoctor-health-html -w '%{http_code}' -H 'Accept: text/html' "http://127.0.0.1:5173$route")
            test "$status" = "200" || { echo "FAIL SPA route $route HTTP $status"; exit 1; }
            grep -q '<div id="root"></div>' /tmp/mydoctor-health-html || { echo "FAIL missing SPA root $route"; exit 1; }
            echo "PASS SPA route $route"
          done
      - name: Verify DB sourced mobile directory search, region, price and calculator actions
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/original-fact-interactions.cjs
      - name: Record native-vs-website baseline transition without false pixel pass
        run: |
          echo "UI_REFERENCE=Android 6.50.0 React Native/Hermes"
          echo "LEGACY_WEB_PIXEL_BASELINE=NOT_APPLICABLE"
          echo "NATIVE_APP_PIXEL_PARITY=NOT_YET_VERIFIED"
          echo "Screen geometry and physical clicks are checked separately."
      - name: Compare 29 real original factual link heading and price row sets against clone
        if: always()
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/original-fact-29.cjs
      - name: Click actual identical original and clone paths and compare destination titles
        if: always()
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/original-click-pairs.cjs
      - name: LEGACY WEBSITE visual reference (not native-app screenshot acceptance) - Verify 29 genuine source screenshot baselines against clone at 10 percent
        if: ${{ false }}
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/visual-baseline-29.cjs
      - name: LEGACY WEBSITE visual reference (not native-app screenshot acceptance) - Compare 29 representative original and clone screen/interaction templates
        if: ${{ false }}
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
          MD_MAX_CASES: 29
        run: node tests/representative-29.cjs
      - name: Test physical mobile interactions with live public data
        if: always()
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/live-smoke.cjs
      - name: LEGACY WEBSITE visual reference (not native-app screenshot acceptance) - Original vs clone pixel-difference audit
        if: ${{ false }}
        working-directory: mydoctor-clone/frontend
        env:
          MD_URL: http://127.0.0.1:5173
        run: node tests/source-parity.cjs
      - name: Upload original screenshots clone screenshots, differences and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-source-parity
          path: mydoctor-clone/frontend/qa-artifacts/
          if-no-files-found: warn

  native-api-runtime-evidence:
    name: Observe anonymous Android API compatibility (no simulated results)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe deployed JSON gateway and observe real original app API status
        working-directory: mydoctor-clone/frontend
        run: node tests/native-api-live-probe.cjs
      - name: Verify original Mounjaro categories and regional price with source-provided ID
        working-directory: mydoctor-clone/frontend
        run: node tests/native-price-api-parity.cjs
      - name: Publish evidence whether original native API actually returned JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-native-api-runtime-evidence
          path: |
            mydoctor-clone/frontend/qa-artifacts/native-api-live-probe.json
            mydoctor-clone/frontend/qa-artifacts/native-price-api-parity.json
          if-no-files-found: warn
