name: MyDoctor original HBC96 standalone native rehost proof
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mydoctor-hermes-rehost-20261113
    paths:
      - .github/workflows/mydoctor-hermes-rehost-original.yml
      - mydoctor-clone/hermes-rehost/**
permissions:
  contents: read
jobs:
  rehost-original-hbc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact APKTool and Android build utilities
        run: |
          set -Eeuo pipefail
          mkdir -p mydoctor-clone/hermes-rehost/tools mydoctor-clone/hermes-rehost/out
          python3 -m pip install Pillow
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            -o mydoctor-clone/hermes-rehost/tools/apktool.jar
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  mydoctor-clone/hermes-rehost/tools/apktool.jar' | sha256sum -c
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "$SDK_TOOLS" >> "$GITHUB_PATH"
          test -x "$SDK_TOOLS/zipalign"
          "$SDK_TOOLS/apksigner" version
          keytool -genkeypair -noprompt -keystore mydoctor-clone/hermes-rehost/tools/rehost.keystore \
            -alias rehost -keyalg RSA -keysize 2048 -validity 7 \
            -storepass android -keypass android -dname 'CN=Temporary Hermes Rehost, O=UI verification, C=KR'
      - name: Fetch byte-identical v6.50.0 XAPK from prior verified source
        run: |
          set -Eeuo pipefail
          mkdir -p mydoctor-clone/hermes-rehost/original
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 260 \
            --user-agent 'Mozilla/5.0 Chrome/124.0.0.0 Safari/537.36' \
            'https://d.apkpure.net/b/XAPK/com.merakiplace.mydoctor?nc=arm64-v8a&sv=24&versionCode=1206' \
            -o mydoctor-clone/hermes-rehost/original/original.xapk
          test "$(wc -c < mydoctor-clone/hermes-rehost/original/original.xapk)" -gt 80000000
          unzip -tqq mydoctor-clone/hermes-rehost/original/original.xapk
      - name: Build separately installable wrapper with original HBC and original native libs
        run: |
          set -Eeuo pipefail
          python3 mydoctor-clone/hermes-rehost/build_unmodified_hbc_wrapper.py \
            --xapk mydoctor-clone/hermes-rehost/original/original.xapk \
            --apktool mydoctor-clone/hermes-rehost/tools/apktool.jar \
            --keystore mydoctor-clone/hermes-rehost/tools/rehost.keystore \
            --out mydoctor-clone/hermes-rehost/out
      - name: Enable x86_64 Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and actually run independent Hermes rehost on Android 11
        id: run_android
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash mydoctor-clone/hermes-rehost/probe_runtime.sh
      - name: Report exact provenance and runnable-UI outcome
        if: always()
        run: |
          cat mydoctor-clone/hermes-rehost/out/build_report.json || true
          cat mydoctor-clone/hermes-rehost/runtime-report/runtime_result.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mydoctor-hbc96-rehost-logs-and-screen-NO-PROPRIETARY-APK
          path: |
            mydoctor-clone/hermes-rehost/out/build_report.json
            mydoctor-clone/hermes-rehost/runtime-report/abi.txt
            mydoctor-clone/hermes-rehost/runtime-report/native_bridge.txt
            mydoctor-clone/hermes-rehost/runtime-report/install.txt
            mydoctor-clone/hermes-rehost/runtime-report/launch.txt
            mydoctor-clone/hermes-rehost/runtime-report/rehost_screen.png
            mydoctor-clone/hermes-rehost/runtime-report/activities.txt
            mydoctor-clone/hermes-rehost/runtime-report/logcat.txt
            mydoctor-clone/hermes-rehost/runtime-report/window.xml
            mydoctor-clone/hermes-rehost/runtime-report/runtime_result.json
          retention-days: 14
          if-no-files-found: warn
      - name: Fail explicitly if genuine native UI was not observed
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('mydoctor-clone/hermes-rehost/runtime-report/runtime_result.json')
          if not p.is_file(): sys.exit('NO_RUNTIME_RESULT')
          r=json.loads(p.read_text())
          if not r.get('original_ui_visible'):sys.exit('ORIGINAL_HERMES_UI_NOT_VISIBLE')
          print('VERIFIED: exact-HBC independently packaged native UI visible')
          PY
