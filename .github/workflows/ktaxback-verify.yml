name: K-TAXBACK Source / Schema / Translation Checks
on:
  push:
    paths:
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'backend/requirements.txt'
      - '.github/workflows/ktaxback-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test deps
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx
      - name: Compile Python
        run: python -m compileall -q backend/app backend/tests
      - name: Run original K-TAXBACK catalogue and translation tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q backend/tests/test_ktaxback.py backend/tests/test_oliveyoung_refresh.py backend/tests/test_ktaxback_translation.py
