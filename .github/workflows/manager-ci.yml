name: Miniapp Manager CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run API and management tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate miniapp and runner syntax
        run: |
          node --check scripts/channel-runner.js
          node --check miniapps/wechat/app.js
          node --check miniapps/wechat/pages/index/index.js
          node --check miniapps/alipay/app.js
          node --check miniapps/alipay/pages/index/index.js
          node --check miniapps/wechat/pages/shop/index.js
          node --check miniapps/wechat/pages/shop/detail.js
          node --check miniapps/alipay/pages/shop/index.js
          node --check miniapps/alipay/pages/shop/detail.js
          node - <<'NODE'
          const fs=require('fs');
          const h5='https://ktaxback-original-live-production.up.railway.app/k-taxback-shop.html';
          for(const p of ['wechat','alipay']){
            const base='miniapps/'+p;
            const app=require('./'+base+'/app.json');
            if(app.pages[0]!=='pages/index/index')throw Error(p+' prearrival first page missing');
            if(!app.pages.includes('pages/shop/index')||!app.pages.includes('pages/shop/detail'))throw Error(p+' missing shopping pages');
            const shell=fs.readFileSync(base+'/pages/shop/index.'+(p==='wechat'?'wxml':'axml'),'utf8');
            if(!shell.includes('<web-view src="{{shopUrl}}"></web-view>'))throw Error(p+' original H5 web-view missing');
            const config=fs.readFileSync(base+'/app.js','utf8');
            if(!config.includes(h5))throw Error(p+' H5 URL mismatch');
            const route=fs.readFileSync(base+'/pages/index/index.js','utf8');
            if(!route.includes("navigateTo({url:'/pages/shop/index'})"))throw Error(p+' shopping navigation missing');
          }
          NODE
