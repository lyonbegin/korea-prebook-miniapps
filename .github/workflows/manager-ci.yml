name: Miniapp Manager CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run API and management tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate miniapp and runner syntax
        run: |
          node --check scripts/channel-runner.js
          node --check miniapps/wechat/app.js
          node --check miniapps/wechat/pages/index/index.js
          node --check miniapps/alipay/app.js
          node --check miniapps/alipay/pages/index/index.js
          node --check miniapps/wechat/pages/shop/index.js
          node --check miniapps/wechat/pages/shop/detail.js
          node --check miniapps/alipay/pages/shop/index.js
          node --check miniapps/alipay/pages/shop/detail.js
          node --check miniapps/wechat/pages/consult/index.js
          node --check miniapps/alipay/pages/consult/index.js
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['wechat','alipay']){
            const base='miniapps/'+p;
            const app=require('./'+base+'/app.json');
            for(const page of ['pages/index/index','pages/shop/detail','pages/consult/index']){
              if(!app.pages.includes(page))throw Error(p+' missing '+page);
            }
            if(app.pages[0]!=='pages/index/index')throw Error(p+' unified catalogue must be first');
            const ext=p==='wechat'?'wxml':'axml';
            for(const page of ['pages/index/index','pages/shop/index','pages/shop/detail','pages/consult/index']){
              const markup=fs.readFileSync(base+'/'+page+'.'+ext,'utf8');
              if(/<web-view[\\s>]/i.test(markup))throw Error(p+' web-view prohibited in native miniapp: '+page);
            }
            const homeJs=fs.readFileSync(base+'/pages/index/index.js','utf8');
            const detailJs=fs.readFileSync(base+'/pages/shop/detail.js','utf8');
            const consultJs=fs.readFileSync(base+'/pages/consult/index.js','utf8');
            const names=['lifting','skin','botox','filler','rhinoplasty','eye','face_contour','breast','body','hair_treatment','hair_removal','kmed','dental','others','cosmetics','aesthetic','nail','hair_salon','guide'];
            for(const category of names)if(!homeJs.includes('"id":"'+category+'"'))throw Error(p+' missing top-level '+category);
            if(homeJs.includes('restaurant_table')||homeJs.includes('airport_luggage_delivery'))throw Error(p+' legacy categories remain');
            if(!homeJs.includes("'/v1/offers?category_id=") || !homeJs.includes("'/v1/ktaxback/miniapp/products?"))throw Error(p+' shared offers and cosmetics catalogues missing');
            if(!detailJs.includes("'/pages/consult/index?id='"))throw Error(p+' product detail consultation route missing');
            if(!consultJs.includes('booking_confirmed:false'))throw Error(p+' unconfirmed consultation must not claim booking');
          }
          NODE
