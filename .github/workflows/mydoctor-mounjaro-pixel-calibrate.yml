name: MyDoctor original Mounjaro automatic pixel calibration
on:
  workflow_dispatch:
  push:
    branches: [feature/mydoctor-hermes-to-react-web-20261114]
    paths:
      - ".github/workflows/mydoctor-mounjaro-pixel-calibrate.yml"
      - "mydoctor-clone/frontend/tests/calibrate-mounjaro-pixels.cjs"
permissions:
  contents: read
  actions: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve captured original HTTP 200 reference screenshot
        uses: actions/download-artifact@v4
        with:
          run-id: 42650015118
          github-token: ${{ github.token }}
          name: mydoctor-source-parity
          path: mydoctor-clone/frontend/qa-original/
      - name: Install, extract original decorative photo, build
        working-directory: mydoctor-clone/frontend
        run: |
          npm install --no-audit --no-fund
          node tests/extract-verified-home-phone.cjs
          npm run build:pages
          npx playwright install --with-deps chromium
      - name: Calibrate against original pixels
        working-directory: mydoctor-clone/frontend
        run: |
          set -euo pipefail
          mkdir -p /tmp/mounjaro-pixel-static/korea-prebook-miniapps
          cp -a dist/. /tmp/mounjaro-pixel-static/korea-prebook-miniapps/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/mounjaro-pixel-static >/tmp/mounjaro-pixel.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            curl -fsS http://127.0.0.1:4173/korea-prebook-miniapps/ >/dev/null && break || sleep 1
          done
          node tests/calibrate-mounjaro-pixels.cjs
      - name: Upload exact CSS optimization and original reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-mounjaro-pixel-optimizer
          path: mydoctor-clone/frontend/mounjaro-calibration/
          retention-days: 14
          if-no-files-found: warn
