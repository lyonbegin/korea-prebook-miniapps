name: MyDoctor Hermes UI — GitHub Pages

on:
  push:
    branches:
      - feature/mydoctor-hermes-to-react-web-20261114
    paths:
      - ".github/workflows/mydoctor-hermes-github-pages.yml"
      - "mydoctor-clone/frontend/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: "pages-mydoctor-hermes"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download verified 2026-11-09 original website screenshot baseline
        uses: actions/download-artifact@v4
        with:
          name: mydoctor-source-parity
          run-id: 42650015118
          repository: lyonbegin/korea-prebook-miniapps
          github-token: ${{ github.token }}
          path: mydoctor-clone/frontend/qa-original
      - name: Install dependencies and build static site
        working-directory: mydoctor-clone/frontend
        run: |
          npm install --no-audit --no-fund
          node tests/extract-verified-home-phone.cjs
          npm run build:pages
          test -s dist/index.html
          if grep -q 'src="/src/main.jsx"' dist/index.html; then
            echo "Vite did not transform entrypoint" >&2
            exit 1
          fi
      - name: Install Chromium browser
        working-directory: mydoctor-clone/frontend
        run: npx playwright install --with-deps chromium
      - name: Start static preview, test real mobile interactions
        working-directory: mydoctor-clone/frontend
        run: |
          set -euo pipefail
          # Reproduce GitHub Pages' repository-prefixed static directory layout
          mkdir -p /tmp/github-pages-static/korea-prebook-miniapps
          cp -a dist/. /tmp/github-pages-static/korea-prebook-miniapps/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/github-pages-static > /tmp/hermes-pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/korea-prebook-miniapps/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/hermes-pages-local.cjs
      - name: Compare original website screenshot pixel-by-pixel in strict page order
        working-directory: mydoctor-clone/frontend
        run: |
          # Keep the incomplete screen as FAIL in the report; publishing a
          # preview must not be interpreted as a visual parity PASS.
          node tests/website-pixel-gate.cjs || echo "SOURCE_WEBSITE_PIXEL_PARITY_NOT_YET_PASSED"
      - name: Save screenshot and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-hermes-github-pages-mobile-evidence
          path: |
            mydoctor-clone/frontend/hermes-pages-evidence/
            mydoctor-clone/frontend/website-pixel-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish static website to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermes-gh-pages
          cp -a mydoctor-clone/frontend/dist/. /tmp/hermes-gh-pages/
          touch /tmp/hermes-gh-pages/.nojekyll
          cd /tmp/hermes-gh-pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish MyDoctor Hermes UI static GitHub Pages"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" push --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/gh-pages
          echo "GITHUB_PAGES_BRANCH_PUBLISHED=gh-pages"
