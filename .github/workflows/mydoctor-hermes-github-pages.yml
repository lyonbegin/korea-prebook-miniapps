name: MyDoctor Hermes UI — GitHub Pages

on:
  push:
    branches:
      - feature/mydoctor-hermes-to-react-web-20261114
    paths:
      - ".github/workflows/mydoctor-hermes-github-pages.yml"
      - "mydoctor-clone/frontend/src/**"
      - "mydoctor-clone/frontend/assets/**"
      - "mydoctor-clone/frontend/public/**"
      - "mydoctor-clone/frontend/index.html"
      - "mydoctor-clone/frontend/package.json"
      - "mydoctor-clone/frontend/scripts/**"
      - "mydoctor-clone/frontend/vite.config.*"
      - "mydoctor-clone/frontend/tests/extract-verified-home-phone.cjs"
      - "mydoctor-clone/frontend/tests/hermes-pages-local.cjs"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: shared-project-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reuse npm and Chromium downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-mydoctor-web-pixel-v2-${{ hashFiles('mydoctor-clone/frontend/package.json') }}
      - name: Download verified original phone screenshot asset
        uses: actions/download-artifact@v4
        with:
          name: mydoctor-source-parity
          run-id: 42650015118
          github-token: ${{ github.token }}
          path: mydoctor-clone/frontend/qa-original
      - name: Install dependencies and build static site
        working-directory: mydoctor-clone/frontend
        run: |
          npm install --no-audit --no-fund --prefer-offline
          node tests/extract-verified-home-phone.cjs
          npm run build:pages
          test -s dist/index.html
          if grep -q 'src="/src/main.jsx"' dist/index.html; then
            echo "Vite did not transform entrypoint" >&2
            exit 1
          fi
      - name: Install Chromium browser
        working-directory: mydoctor-clone/frontend
        run: npx playwright install --with-deps chromium
      - name: Start static preview, test real mobile interactions
        working-directory: mydoctor-clone/frontend
        run: |
          set -euo pipefail
          # Reproduce GitHub Pages' repository-prefixed static directory layout
          mkdir -p /tmp/github-pages-static/korea-prebook-miniapps
          cp -a dist/. /tmp/github-pages-static/korea-prebook-miniapps/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/github-pages-static > /tmp/hermes-pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/korea-prebook-miniapps/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/hermes-pages-local.cjs
      - name: Save mobile interaction test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-hermes-github-pages-mobile-evidence
          path: |
            mydoctor-clone/frontend/hermes-pages-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish static website to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/shared-pages
          rsync -a --delete --exclude='.git/' --exclude='/unni/' mydoctor-clone/frontend/dist/ /tmp/shared-pages/
          touch /tmp/shared-pages/.nojekyll
          cd /tmp/shared-pages
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish MyDoctor root while preserving UNNI subdirectory"
          git push origin gh-pages
          echo "GITHUB_PAGES_BRANCH_PUBLISHED=gh-pages"
