name: MyDoctor source-web department 390px pixel calibration
on:
  workflow_dispatch:
  push:
    branches: [feature/mydoctor-hermes-to-react-web-20261114]
    paths:
      - ".github/workflows/mydoctor-department-pixel-calibrate.yml"
      - "mydoctor-clone/frontend/tests/calibrate-department-pixels.cjs"
permissions:
  contents: read
  actions: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download HTTP200 original browser screenshot
        uses: actions/download-artifact@v4
        with:
          run-id: 42650015118
          github-token: ${{ github.token }}
          name: mydoctor-source-parity
          path: mydoctor-clone/frontend/qa-original/
      - name: Install browser and build GitHub Pages app
        working-directory: mydoctor-clone/frontend
        run: |
          npm install --no-audit --no-fund
          node tests/extract-verified-home-phone.cjs
          npm run build:pages
          npx playwright install --with-deps chromium
      - name: Calibrate source pixel mismatch (no invented screenshot)
        working-directory: mydoctor-clone/frontend
        run: |
          set -euo pipefail
          mkdir -p /tmp/dept-calibration-static/korea-prebook-miniapps
          cp -a dist/. /tmp/dept-calibration-static/korea-prebook-miniapps/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/dept-calibration-static >/tmp/dept-pixel-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:4173/korea-prebook-miniapps/ >/dev/null && break || sleep 1; done
          node tests/calibrate-department-pixels.cjs
      - name: Upload source-based calibrated best and steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-original-department-auto-pixel-calibration
          path: mydoctor-clone/frontend/department-pixel-calibration/
          retention-days: 14
          if-no-files-found: warn
