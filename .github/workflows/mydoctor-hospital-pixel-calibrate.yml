name: MyDoctor original hospital pixel typography calibration
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mydoctor-hermes-to-react-web-20261114
    paths:
      - .github/workflows/mydoctor-hospital-pixel-calibrate.yml
      - mydoctor-clone/frontend/tests/calibrate-hospital-pixels.cjs
permissions:
  contents: read
  actions: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42650015118
          github-token: ${{ github.token }}
          name: mydoctor-source-parity
          path: mydoctor-clone/frontend/qa-original
      - name: Build mobile web and install browser
        working-directory: mydoctor-clone/frontend
        run: |
          npm install --no-audit --no-fund
          node tests/extract-verified-home-phone.cjs
          npm run build:pages
          npx playwright install --with-deps chromium
      - name: Measure original screenshot mismatch for candidate CSS values
        working-directory: mydoctor-clone/frontend
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/mydoctor-calibration/korea-prebook-miniapps
          cp -a dist/. /tmp/mydoctor-calibration/korea-prebook-miniapps/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/mydoctor-calibration > /tmp/mydoctor-calibration.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/korea-prebook-miniapps/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/calibrate-hospital-pixels.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-original-hospital-calibration
          path: mydoctor-clone/frontend/website-pixel-calibration/
          if-no-files-found: warn
          retention-days: 14
