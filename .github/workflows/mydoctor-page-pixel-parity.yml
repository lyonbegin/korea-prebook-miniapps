name: MyDoctor 29-screen source web pixel audit (parallel)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mydoctor-hermes-to-react-web-20261114
    paths:
      - ".github/workflows/mydoctor-page-pixel-parity.yml"
      - "mydoctor-clone/frontend/tests/website-pixel-fast.cjs"
      - "mydoctor-clone/frontend/src/**"
      - "mydoctor-clone/frontend/index.html"
      - "mydoctor-clone/frontend/package.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: mydoctor-original-web-pixel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parallel-29-pixel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm and Chromium browser downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-mydoctor-web-pixel-v2-${{ hashFiles('mydoctor-clone/frontend/package.json') }}
      - name: Retrieve all 29 real source browser captures (2026-11-09 HTTP 200)
        uses: actions/download-artifact@v4
        with:
          run-id: 42650015118
          github-token: ${{ github.token }}
          name: mydoctor-source-parity
          path: mydoctor-clone/frontend/qa-original
      - name: Check screenshot baseline coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("mydoctor-clone/frontend")
          cases=json.loads((root/"src/data/representative-29.json").read_text())["cases"]
          missing=[c["id"] for c in cases if not (root/"qa-original"/("origin-"+c["id"]+".png")).is_file()]
          print("SOURCE_ORIGINAL_SCREENSHOTS", len(cases)-len(missing), "/",len(cases))
          if missing: print("SOURCE_MISSING", ",".join(missing))
          PY
      - name: Build GitHub Pages clone and install browser
        working-directory: mydoctor-clone/frontend
        run: |
          npm install --no-audit --no-fund --prefer-offline
          node tests/extract-verified-home-phone.cjs
          npm run build:pages
          npx playwright install --with-deps chromium
      - name: Compare 29 screens in parallel, collecting all failed screens
        working-directory: mydoctor-clone/frontend
        env:
          PIXEL_WORKERS: "4"
          PIXEL_FONT_SWEEP: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/mydoctor-parity-static/korea-prebook-miniapps
          cp -a dist/. /tmp/mydoctor-parity-static/korea-prebook-miniapps/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/mydoctor-parity-static > /tmp/mydoctor-parity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/korea-prebook-miniapps/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/website-pixel-fast.cjs
      - name: Upload all 29 results and side-by-side difference images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydoctor-parallel-29-pixel-report
          path: |
            mydoctor-clone/frontend/website-pixel-evidence/
          if-no-files-found: warn
          retention-days: 30
